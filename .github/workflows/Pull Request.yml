name: CI on Pull Request

on:
  pull_request:
    branches:
      - '**'

permissions:
  statuses: write

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Setup msbuild
      uses: microsoft/setup-msbuild@v2

    - name: Install ASP.NET web workload
      shell: pwsh
      run: |
        $vsWhere = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe"
        $vsInstaller = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe"
        $installPath = & $vsWhere -latest -property installationPath
        & $vsInstaller modify --installPath "$installPath" --add Microsoft.VisualStudio.Workload.NetWeb --includeRecommended --quiet --norestart --wait
        if ($LASTEXITCODE -notin 0, 3010) { throw "VS workload install failed with exit code $LASTEXITCODE" }

    - name: Restore NuGet packages
      run: |
        nuget restore "Hunter Industries API.sln"
        dotnet restore "Hunter Industries API Common/Hunter Industries API Common.csproj"
        dotnet restore "Hunter Industries API Control Panel/Hunter Industries API Control Panel.csproj"
        dotnet restore "Tests/Hunter Industries API.UnitTests/Hunter Industries API.UnitTests.csproj"
        dotnet restore "Tests/Hunter Industries API.PersistenceTests/Hunter Industries API.PersistenceTests.csproj"
        dotnet restore "Tests/Hunter Industries API.IntegrationTests/Hunter Industries API.IntegrationTests.csproj"

    - name: Navigate to workspace
      run: cd $GITHUB_WORKSPACE

    - name: Build .NET Common project
      run: dotnet build "Hunter Industries API Common/Hunter Industries API Common.csproj" --configuration Release --no-restore

    - name: Build .NET Framework projects
      run: msbuild.exe "Hunter Industries API/Hunter Industries API.csproj" /p:configuration="Release"

    - name: Build .NET Control Panel project
      run: dotnet build "Hunter Industries API Control Panel/Hunter Industries API Control Panel.csproj" --configuration Release --no-restore

    - name: Build UnitTests (net472)
      run: msbuild.exe "Tests/Hunter Industries API.UnitTests/Hunter Industries API.UnitTests.csproj" /p:Configuration=Release /p:TargetFramework=net472

    - name: Build UnitTests (net10.0)
      run: dotnet build "Tests/Hunter Industries API.UnitTests/Hunter Industries API.UnitTests.csproj" --configuration Release --no-restore --framework net10.0

    - name: Build PersistenceTests (net472)
      run: msbuild.exe "Tests/Hunter Industries API.PersistenceTests/Hunter Industries API.PersistenceTests.csproj" /p:Configuration=Release /p:TargetFramework=net472

    - name: Build PersistenceTests (net10.0)
      run: dotnet build "Tests/Hunter Industries API.PersistenceTests/Hunter Industries API.PersistenceTests.csproj" --configuration Release --no-restore --framework net10.0

    - name: Build IntegrationTests (net472)
      run: msbuild.exe "Tests/Hunter Industries API.IntegrationTests/Hunter Industries API.IntegrationTests.csproj" /p:Configuration=Release /p:TargetFramework=net472

    - name: Run tests with coverage
      run: |
        dotnet test "Tests/Hunter Industries API.UnitTests/Hunter Industries API.UnitTests.csproj" --configuration Release --no-build --verbosity normal --settings coverlet.runsettings --collect:"XPlat Code Coverage" --results-directory ./TestResults
        dotnet test "Tests/Hunter Industries API.PersistenceTests/Hunter Industries API.PersistenceTests.csproj" --configuration Release --no-build --verbosity normal --settings coverlet.runsettings --collect:"XPlat Code Coverage" --results-directory ./TestResults
        dotnet test "Tests/Hunter Industries API.IntegrationTests/Hunter Industries API.IntegrationTests.csproj" --configuration Release --no-build --verbosity normal --settings coverlet.runsettings --collect:"XPlat Code Coverage" --results-directory ./TestResults

    - name: Install ReportGenerator
      run: dotnet tool install --global dotnet-reportgenerator-globaltool

    - name: Generate coverage report
      run: reportgenerator -reports:"./TestResults/**/coverage.cobertura.xml" -targetdir:"./TestResults/CoverageReport" -reporttypes:"Cobertura;JsonSummary"

    - name: Post coverage status
      if: github.event_name == 'pull_request'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: bash
      run: |
        COVERAGE=$(python3 -c "
        import json
        with open('./TestResults/CoverageReport/Summary.json') as f:
            data = json.load(f)
        print(round(data['summary']['linecoverage'], 1))
        ")

        echo "coverage=$COVERAGE" >> "$GITHUB_OUTPUT"

        echo "### Code Coverage" >> "$GITHUB_STEP_SUMMARY"
        echo "Line coverage: **${COVERAGE}%**" >> "$GITHUB_STEP_SUMMARY"

        gh api repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }} \
          -f state="success" \
          -f context="code-coverage" \
          -f description="Line coverage: ${COVERAGE}%" \
          -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: ./TestResults/CoverageReport/

    - name: Publish API (.NET Framework)
      run: >
        msbuild.exe "Hunter Industries API/Hunter Industries API.csproj"
        /p:Configuration=Release
        /p:DeployOnBuild=true
        /p:DeployTarget=WebPublish
        /p:WebPublishMethod=FileSystem
        /p:publishUrl=${{ github.workspace }}\artifacts\HunterIndustriesAPI
        /p:DeleteExistingFiles=true

    - name: Publish Control Panel (.NET 10)
      run: >
        dotnet publish
        "Hunter Industries API Control Panel/Hunter Industries API Control Panel.csproj"
        -c Release
        -o ./artifacts/HunterIndustriesAPIControlPanel

    - name: Set Build Timestamp
      id: timestamp
      shell: bash
      run: echo "value=$(date -u +%Y%m%d%H%M)" >> $GITHUB_OUTPUT

    - name: Upload API Artefact
      uses: actions/upload-artifact@v4
      with:
        name: HunterIndustriesAPI_${{ steps.timestamp.outputs.value }}
        path: ./artifacts/HunterIndustriesAPI

    - name: Upload Control Panel Artefact
      uses: actions/upload-artifact@v4
      with:
        name: HunterIndustriesAPIControlPanel_${{ steps.timestamp.outputs.value }}
        path: ./artifacts/HunterIndustriesAPIControlPanel
